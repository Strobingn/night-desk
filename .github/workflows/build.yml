name: Build Night-Desk on Code Change

on:
  push:
    branches:
      - gemini
      - main
  pull_request:
    branches:
      - gemini
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test-desk:
    name: Typecheck, Test & Build Desk (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck (Server + Web)
        run: npm run typecheck

      - name: Run Vitest Suite
        run: npm test

      - name: Build Web UI & Server
        run: npm run build:web && npm run build:server

      - name: Package Built Desk Server & Web Artifact
        id: server_pkg
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          BUNDLE="night-desk-app-${SAFE_REF}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.tar.gz"
          tar -czf "$BUNDLE" \
            dist/ web/dist/ scripts/ deploy/ \
            package.json package-lock.json ecosystem.config.cjs Dockerfile docker-compose.yml .env.example
          echo "bundle_name=${BUNDLE}" >> $GITHUB_OUTPUT

      - name: Upload Server & Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.server_pkg.outputs.bundle_name }}
          path: ./${{ steps.server_pkg.outputs.bundle_name }}
          retention-days: 30

  build-android-apk:
    name: Build Android Companion App (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test-desk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission on gradlew
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: |
          # services.gradle.org redirects the wrapper zip to a GitHub release that is returning 504.
          # Fall back to a mirror for this job only. The committed wrapper URL stays the official one.
          if ! curl -fsI --max-time 20 -o /dev/null "https://github.com/gradle/gradle-distributions/releases/download/v8.11.1/gradle-8.11.1-bin.zip"; then
            echo "Official Gradle distribution is unavailable. Using the Tencent mirror for this job."
            sed -i 's|https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip|https\\://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          fi
          for attempt in 1 2 3; do
            ./gradlew assembleDebug --stacktrace && exit 0
            echo "assembleDebug attempt ${attempt} failed"
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 20
          done

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install desk dependencies
        run: npm ci

      - name: Start mocked armed desk
        run: |
          mkdir -p /tmp/nd-gate
          npx vitest run --config vitest.gate.config.ts > /tmp/nd-gate/server.log 2>&1 &
          echo $! > /tmp/nd-gate/pid
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8791/api/health && exit 0
            sleep 2
          done
          cat /tmp/nd-gate/server.log
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Native paper gate on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash scripts/apk-gate-device.sh

      - name: Copy gate logs
        if: always()
        run: |
          mkdir -p gate-logs
          cp /tmp/nd-gate/http.jsonl /tmp/nd-gate/swaps.jsonl /tmp/nd-gate/server.log gate-logs/ 2>/dev/null || true

      - name: Keep the gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-paper-gate-log-${{ github.run_number }}
          path: gate-logs/
          retention-days: 14
          if-no-files-found: warn

      - name: Rename APK Artifact
        id: apk_pkg
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          RAW_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          APK_NAME="night-desk-${SAFE_REF}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          cp "$RAW_APK" "./${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_pkg.outputs.apk_name }}
          path: ./${{ steps.apk_pkg.outputs.apk_name }}
          retention-days: 30

      - name: Create GitHub Release on Code Push (gemini branch)
        if: github.ref == 'refs/heads/gemini' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gemini-build-${{ github.run_number }}
          name: "Night-Desk Automated Build #${{ github.run_number }} (gemini)"
          body: |
            Automated build generated from commit `${{ github.sha }}` on branch `gemini`.
            - **Android APK:** `${{ steps.apk_pkg.outputs.apk_name }}`
            - **Backend & Agent Test Suite:** Passed
          prerelease: true
          files: ./${{ steps.apk_pkg.outputs.apk_name }}
