name: Screenshot audit 13.16 vs 13.17

# Audit only. Installs the already-built merge APKs. Does not bump the app or ship a release.
on:
  pull_request:
    paths:
      - .github/workflows/screenshot-audit.yml
      - scripts/screenshot_audit.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shots:
    name: Native screenshots of the release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the exact merge APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apks
          gh run download 42514435687 --repo Strobingn/night-desk --name night-desk-main-35-80fe13b.apk --dir apks/1316
          gh run download 42522494954 --repo Strobingn/night-desk --name night-desk-main-42-ed4c200.apk --dir apks/1317
          find apks -name '*.apk' -exec ls -l {} \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install desk dependencies
        run: npm ci

      - name: Start mocked desk
        run: |
          mkdir -p /tmp/nd-gate
          npx vitest run --config vitest.gate.config.ts > /tmp/nd-gate/server.log 2>&1 &
          echo $! > /tmp/nd-gate/pid
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8791/api/health && exit 0
            sleep 2
          done
          cat /tmp/nd-gate/server.log
          exit 1

      - name: Install emulator libraries
        run: sudo apt-get update && sudo apt-get install -y libpulse0 libx11-xcb1 libxcb-cursor0 libxkbcommon0 python3-pil

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture every tab on both APKs
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QT_QPA_PLATFORM: offscreen
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot-save -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash scripts/screenshot-audit-device.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-audit-1316-1317
          path: shot-out/
          retention-days: 14
          if-no-files-found: error
